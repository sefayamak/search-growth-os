# Search Growth OS — bulut Brain (GitHub Actions -> Anthropic API -> uzman ajanlar -> Chief).
#
# NEDEN VAR: agents/*.md uzmanlarini Claude Code'un icinden cikarip bilgisayar KAPALIYKEN de
# calisan bir bulut calisma zamanina baglamak. Claude Code calisma zamani DEGILDIR.
#
# SADECE ELLE (workflow_dispatch): schedule YOK. Ilk surum bir pilottur; zamanlama ve kalici bellek
# ilk canli dogrulamadan SONRA ayrica tasarlanir.
#
# YAZMA YOK: contents: read. Depoya commit yok, PR acilmaz, production'a/Vercel'e dokunulmaz,
# --write-memory GECILMEZ (bellek yalniz artifact'te aday olarak kalir).
#
# MALIYET: en fazla 3 uzman + 1 Chief + 1 uyum incelemesi = 5 Anthropic cagrisi (kodda zorlanir).
# Anahtar ya da model yoksa is YESIL kalir, rapor NOT_CONFIGURED yazar ve HICBIR cagri yapilmaz.
#
# GIZLILIK: anahtar YALNIZCA `secrets.*` -> env; komut satirina, loga, artifact'e, hata mesajina girmez.
# Model repo variable'indan gelir (SEARCH_GROWTH_ANTHROPIC_MODEL); koda gomulu degildir.

name: Brain (cloud, read-only)

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site kimligi (onboard edilmis olmali). Ilk pilot: pamistanbul."
        type: string
        default: "pamistanbul"
      evidence_path:
        description: "Depo icinde sgos.brain.evidence-bundle.v1 JSON yolu (bos = yalniz registry baglami; kanit yoksa analiz yapilmaz)."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: brain
  cancel-in-progress: false

jobs:
  brain:
    name: brain (<=5 API cagrisi / kosu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Registry gate
        run: node --experimental-strip-types src/cli.ts registry config/sites.yaml

      - name: Girdi dogrulamasi
        env:
          SITE: ${{ inputs.site }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          case "$SITE" in ''|*[!a-z0-9]*) echo "site kimligi kucuk harf/rakam olmali"; exit 1;; esac
          if [ -n "$EVIDENCE_PATH" ]; then
            case "$EVIDENCE_PATH" in /*|*..*|*[!A-Za-z0-9._/-]*) echo "evidence_path depo icinde, guvenli karakterli bir .json yolu olmali"; exit 1;; esac
            case "$EVIDENCE_PATH" in *.json) ;; *) echo "evidence_path .json olmali"; exit 1;; esac
            [ -f "$EVIDENCE_PATH" ] || { echo "evidence_path bulunamadi"; exit 1; }
          fi

      - name: Brain dogrulama (offline, API cagrisi YOK)
        env:
          SEARCH_GROWTH_ANTHROPIC_API_KEY: ${{ secrets.SEARCH_GROWTH_ANTHROPIC_API_KEY }}
          SEARCH_GROWTH_ANTHROPIC_MODEL: ${{ vars.SEARCH_GROWTH_ANTHROPIC_MODEL }}
          SITE: ${{ inputs.site }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          set -o pipefail
          node --experimental-strip-types src/cli.ts brain-validate config/sites.yaml --site "$SITE" ${EVIDENCE_PATH:+--evidence "$EVIDENCE_PATH"} | tee brain-validate.txt

      - name: Brain kosusu
        env:
          SEARCH_GROWTH_ANTHROPIC_API_KEY: ${{ secrets.SEARCH_GROWTH_ANTHROPIC_API_KEY }}
          SEARCH_GROWTH_ANTHROPIC_MODEL: ${{ vars.SEARCH_GROWTH_ANTHROPIC_MODEL }}
          SITE: ${{ inputs.site }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          set -o pipefail
          node --experimental-strip-types src/cli.ts brain-run config/sites.yaml --site "$SITE" --out brain-out ${EVIDENCE_PATH:+--evidence "$EVIDENCE_PATH"} | tee brain-run.txt

      - name: Ozet
        if: always()
        env:
          SITE: ${{ inputs.site }}
        run: |
          { cat "brain-out/brain-report-${SITE}.md" 2>/dev/null || echo "Brain raporu uretilemedi — adim loglarina bak."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: brain-${{ github.run_id }}
          path: |
            brain-out/
            brain-validate.txt
            brain-run.txt
          retention-days: 30
          if-no-files-found: warn
