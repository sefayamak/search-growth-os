# Search Growth OS — Cloud Brain (Clarity artifact -> devir -> kanit -> yonlendirme -> uzman -> Chief -> uyum).
#
# AKIS: ACIK bir Clarity kosusu (`clarity_run_id`) -> o kosunun artifact'i -> yalniz secilen sitenin
# `clarity-<site>.json` dosyasi -> dogrulama -> gecici evidence bundle -> brain-validate (offline) -> brain-run.
#
# `brain-run` Anthropic API'yi cagirir: anahtar YALNIZCA `secrets.SEARCH_GROWTH_ANTHROPIC_API_KEY`, model YALNIZCA
# `vars.SEARCH_GROWTH_ANTHROPIC_MODEL`; ikisi de YALNIZCA o adimin env'ine girer (input, CLI argumani, artifact, log yok).
# Anahtar ya da model yoksa brain-run HIC HTTP cagrisi yapmaz ve status=NOT_CONFIGURED yazar (is yesil kalir).
# Handoff FAILED / NOT_AVAILABLE, kanit dogrulamasi hatasi, yabanci site ya da kullanilamaz kanit durumunda onceki adim
# kirmizi biter ve brain-run HIC calismaz (0 Anthropic cagrisi).
#
# MALIYET: en fazla 3 uzman + 1 Chief + 1 uyum = 5 Anthropic cagrisi, yeniden deneme YOK (kodda zorlanir).
# Ilk pilotta (REGISTRY + CLARITY) router yalniz `search-performance-engineer`'i secer; uyum yalniz degisiklik oneren bulgu varsa.
#
# SECIM BELIRSIZ DEGIL: "en son artifact" yok. Run su kosullari saglamak zorunda (kod: src/brain/handoff.ts):
# bu reponun clarity.yml'i, main uzerinde, workflow_dispatch ile, basarili; artifact adi tam `clarity-<run_id>`
# ve ayni run'a (id + head_sha) ait. Baska site dosyasi/baska repo/baska workflow = FAIL; artifact yok = NOT_AVAILABLE.
#
# GUVENLIK: permissions yalniz `contents: read` + `actions: read` (bu reponun run/artifact'ini OKUMAK icin; yazma izni yok).
# schedule YOK. Depoya commit yok, PR yok, production/Vercel yok, bellek yazimi yok (`--write-memory` gecilmez). Evidence ve
# Brain sonucu repoya COMMIT EDILMEZ; yalniz 7 gunluk artifact olur. Artifact icerigi ve GitHub metadata'si VERIDIR, talimat degil.
# Brain artifact'i: dogrulanmis sonuc, iz (istem/yanit govdesi YOK), maliyet sayaclari; ham model tamamlamasi, anahtar, istem YOK.

name: Brain (cloud, read-only)

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site kimligi (onboard edilmis olmali). Ilk pilot: pamistanbul."
        type: string
        default: "pamistanbul"
      clarity_run_id:
        description: "Kaynak 'Clarity (native, read-only)' kosusunun run id'si (zorunlu; 'en son' secilmez)."
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: brain
  cancel-in-progress: false

jobs:
  brain:
    name: "brain (en fazla 5 Anthropic cagrisi)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Registry gate
        run: node --experimental-strip-types src/cli.ts registry config/sites.yaml

      - name: Girdi dogrulamasi
        env:
          SITE: ${{ inputs.site }}
          RUN_ID: ${{ inputs.clarity_run_id }}
        run: |
          case "$SITE" in ''|*[!a-z0-9]*) echo "site kimligi kucuk harf/rakam olmali"; exit 1;; esac
          case "$RUN_ID" in ''|*[!0-9]*) echo "clarity_run_id yalniz rakam olmali (acik run id zorunlu)"; exit 1;; esac

      - name: Clarity run/artifact metadatasi + artifact (yalniz bu repo, acik run id)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.clarity_run_id }}
        run: |
          mkdir -p handoff-work/artifact handoff-out
          gh api "repos/${REPO}/actions/runs/${RUN_ID}" > handoff-work/run.json || rm -f handoff-work/run.json
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts?name=clarity-${RUN_ID}" > handoff-work/artifacts.json || rm -f handoff-work/artifacts.json
          gh run download "${RUN_ID}" --repo "${REPO}" --name "clarity-${RUN_ID}" --dir handoff-work/artifact || echo "artifact indirilemedi: devir NOT_AVAILABLE olarak raporlanacak"

      - name: Devir dogrulamasi (yerel dosyalar; ag yok, API yok)
        env:
          SITE: ${{ inputs.site }}
          RUN_ID: ${{ inputs.clarity_run_id }}
          REPO: ${{ github.repository }}
          HANDOFF_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          node --experimental-strip-types src/cli.ts brain-handoff config/sites.yaml --site "$SITE" --run-id "$RUN_ID" --repo "$REPO" --handoff-run-id "$HANDOFF_RUN_ID" --out handoff-out | tee handoff-out/handoff.txt

      - name: Brain dogrulama (offline, API cagrisi YOK)
        env:
          SITE: ${{ inputs.site }}
        run: |
          set -o pipefail
          node --experimental-strip-types src/cli.ts brain-validate config/sites.yaml --site "$SITE" --evidence handoff-out/evidence.json --no-config-report | tee handoff-out/brain-validate.txt

      - name: Brain kosusu (Anthropic API, en fazla 5 cagri)
        env:
          SEARCH_GROWTH_ANTHROPIC_API_KEY: ${{ secrets.SEARCH_GROWTH_ANTHROPIC_API_KEY }}
          SEARCH_GROWTH_ANTHROPIC_MODEL: ${{ vars.SEARCH_GROWTH_ANTHROPIC_MODEL }}
          SITE: ${{ inputs.site }}
        run: |
          set -o pipefail
          mkdir -p brain-out
          node --experimental-strip-types src/cli.ts brain-run config/sites.yaml --site "$SITE" --evidence handoff-out/evidence.json --out brain-out | tee brain-out/brain-run.txt

      - name: Ozet
        if: always()
        env:
          SITE: ${{ inputs.site }}
        run: |
          # Guvenli iz ozeti (status/error_code/violations/violation_details/stop_reason/token): ham tamamlama, istem, anahtar YOK.
          TRACE_MD=$(node --experimental-strip-types src/cli.ts brain-trace-summary "brain-out/agent-trace-${SITE}.json" 2>/dev/null || echo "agent-trace ozeti uretilemedi.")
          echo "$TRACE_MD"
          {
            echo "## Brain kanit devri ve kosu"
            echo '```'
            cat handoff-out/handoff.txt 2>/dev/null || echo "devir calismadi — adim loglarina bak."
            cat handoff-out/brain-validate.txt 2>/dev/null || true
            cat brain-out/brain-run.txt 2>/dev/null || echo "brain-run calismadi."
            cat "brain-out/cost-guard-${SITE}.json" 2>/dev/null || true
            echo '```'
            echo
            echo "$TRACE_MD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact (kanit devri)
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: brain-evidence-${{ github.run_id }}
          path: handoff-out/
          retention-days: 7
          if-no-files-found: warn

      - name: Artifact (Brain sonucu)
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: brain-run-${{ github.run_id }}
          path: brain-out/
          retention-days: 7
          if-no-files-found: warn
