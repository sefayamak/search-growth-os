# Search Growth OS — sahipli veri ölçümü (GSC + GA4, salt-okunur)
#
# NİYE BU VAR: ölçüm her seferinde birinin bilgisayarına, tarayıcı oturumuna ve
# elle rapor indirmesine bağlıysa, pratikte hiç yapılmaz. Bu iş kimlik bilgisini
# GitHub Secret'ta tutar, haftada bir kendi kendine koşar ve sonucu depoya bir
# rapor dosyası olarak yazar. Böylece rakamlara bakmak isteyen herkes —insan ya
# da ajan— dosyayı okur; kimsenin anahtara erişmesi gerekmez.
#
# GİZLİLİK SÖZLEŞMESİ (değiştirilemez):
#   - Anahtar YALNIZCA `secrets.*` üzerinden env'e geçer. Komut satırına
#     yazılmaz (ps çıktısında görünürdü), dosyaya dökülmez, `echo`lanmaz.
#   - Üretilen rapor ve step summary yalnız SAYI içerir; istemci hata
#     mesajlarını da anahtar taşımayacak şekilde yazdı (bkz. google-auth.ts).
#   - Bu iş fork PR'larda koşmaz: `pull_request` tetikleyicisi yok, çünkü fork
#     bir PR'ı secret'a erişemez ve erişebilseydi sızdırma yolu olurdu.
#
# YAZMA YOK: GSC ve GA4 kapsamları salt-okunur (`webmasters.readonly`,
# `analytics.readonly`). Sitemap gönderme, URL kaldırma, Indexing API yok.
#
# KİMLİK YOKSA: iş yeşil kalır ve raporda NOT_CONNECTED yazar. Sahte sayı
# üretmez. "Ölçemedim" ile "ölçtüm, sıfır çıktı" bu projede asla karışmaz.

name: Ölçüm (GSC + GA4)

on:
  workflow_dispatch:
    inputs:
      commit_report:
        description: "Raporu depoya yaz (kapatırsan yalnız artifact üretir)"
        type: boolean
        default: true
  schedule:
    # 06:40 UTC Pazartesi (09:40 Europe/Istanbul) — içerik ve teknik
    # kontrollerden sonra: önce "ne yayınladık", sonra "ne sonuç verdi".
    - cron: "40 6 * * 1"

permissions:
  contents: write # yalnız reports/ altına rapor yazmak için

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  measure:
    name: sahipli veri ölçümü
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Registry gate
        run: node --experimental-strip-types src/cli.ts registry config/sites.yaml

      # Bağlantı durumu ÖNCE raporlanır. "Env dolu" ile "API cevap veriyor" ayrı
      # şeylerdir: servis hesabı property'ye eklenmemişse 403 gelir ve bu, sıfır
      # trafik gibi okunmamalıdır. Duman testi bunu ayırır ve işi düşürmez —
      # amacı engellemek değil, sebebi isimlendirmek.
      - name: Duman testi (salt-okunur)
        id: smoke
        continue-on-error: true
        env:
          SEARCH_GROWTH_GSC_CREDENTIALS_JSON: ${{ secrets.SEARCH_GROWTH_GSC_CREDENTIALS_JSON }}
          SEARCH_GROWTH_GA4_CREDENTIALS_JSON: ${{ secrets.SEARCH_GROWTH_GA4_CREDENTIALS_JSON }}
        run: |
          set -o pipefail
          node --experimental-strip-types src/cli.ts smoke config/sites.yaml | tee smoke.txt

      # TEK GSC CAGRISI: Markdown (stdout -> measure.txt) ve makine-okunur JSON (`--out`, sgos.measure-report.v1,
      # docs/measure-report.md) AYNI kosunun AYNI bellek-ici sonuclarindan uretilir; ikinci bir `measure` kosusu YOK
      # (ikinci kosu GSC'yi site basina 4 yerine 8 kez cagirir ve iki dosyanin donem/zaman damgasi ayrisabilirdi).
      # Stdout bayt-bayt eskisiyle ayni (golden testi); `--out` yalniz `measure-json/` dizinine yazar.
      #
      # JSON hatasi: Markdown zaten tamamen basildi ve measure.txt'e yazildi; kosu burada DURMAZ (rapor, commit,
      # artifact devam eder) ama SESSIZ DA DEGIL — `measure-report.error.txt` isareti varsa json_failed=true yazilir ve
      # isin SON adimi ("Olcum JSON kapisi") kosuyu KIRMIZI yapar. Isaret yoksa (kayit/registry/cokme) eskisi gibi kirmizi.
      - name: Ölçüm
        id: measure
        env:
          SEARCH_GROWTH_GSC_CREDENTIALS_JSON: ${{ secrets.SEARCH_GROWTH_GSC_CREDENTIALS_JSON }}
          SEARCH_GROWTH_GA4_CREDENTIALS_JSON: ${{ secrets.SEARCH_GROWTH_GA4_CREDENTIALS_JSON }}
        run: |
          rm -rf measure-json
          mkdir -p measure-json
          node --experimental-strip-types src/cli.ts measure config/sites.yaml --out measure-json | tee measure.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            if [ -f measure-json/measure-report.error.txt ]; then
              echo "json_failed=true" >> "$GITHUB_OUTPUT"
              echo "::warning::sgos.measure-report.v1 JSON üretilemedi; Markdown ölçümü tamam ve rapora girecek. Sebep: $(head -c 300 measure-json/measure-report.error.txt)"
            else
              exit "$rc"
            fi
          fi

      # Gelir siteleri icin kirilim. Toplam sayi sorunun VARLIGINI gosterir,
      # sebebini gostermez: 58.071 gosterim / 204 tik, agirlikli sira 3,5 iken
      # TO %0,35 — o siradan %10-25 beklenir. Hangi sorgu ve sayfanin gosterimi
      # tasidigi gorulmeden bu fark aciklanamaz.
      - name: Kirilim (gelir siteleri)
        continue-on-error: true
        env:
          SEARCH_GROWTH_GSC_CREDENTIALS_JSON: ${{ secrets.SEARCH_GROWTH_GSC_CREDENTIALS_JSON }}
        run: |
          set -o pipefail
          : > detail.txt
          for s in pamistanbul pamaistudio untitledportraits; do
            node --experimental-strip-types src/cli.ts detail config/sites.yaml --site "$s" --top 15 >> detail.txt
          done
          cat detail.txt

      # Konu fırsatı — her site için HER HAFTA TAM 2 konu. Önce KANIT: site
      # kendi GSC verisinde, insanların zaten arayıp siteyi zaten gördüğü ama
      # tıklamadığı sorgular. Yetmezse EDİTORYAL: registry'deki
      # business_category'den (Sefa'nın kendi yazdığı "bu site ne satıyor"
      # cümlesi) türetilmiş alıcı sorusu şekilli başlık. Google Trends, rakip
      # analizi ya da başka bir dış "trend" kaynağı YOK — ikisi de ya ölçülmüş
      # ya da sitenin kendi tanımından türetilmiş, hiçbiri tahmin değil.
      #
      # Yalnızca "buraya bak" listesi — hiçbir şey yazmaz, deploy etmez,
      # indekslemez. Karar insanda kalır; yayına giden her yazı ayrıca insan
      # onayından geçer.
      #
      # content/topic-ledger.json depoda kalıcı: aynı başlık hafta hafta "yeni
      # keşif" gibi gösterilmesin diye ilk görülme tarihini tutuyor.
      - name: Konu fırsatı — 2 konu / site / hafta
        continue-on-error: true
        env:
          SEARCH_GROWTH_GSC_CREDENTIALS_JSON: ${{ secrets.SEARCH_GROWTH_GSC_CREDENTIALS_JSON }}
        run: |
          set -o pipefail
          node --experimental-strip-types src/cli.ts topics config/sites.yaml \
            --count 2 --top 10 --ledger content/topic-ledger.json --write-ledger | tee topics.txt

      - name: Raporu derle
        run: |
          mkdir -p reports
          {
            echo "# Ölçüm — $(date -u +%Y-%m-%d)"
            echo
            echo "Üreten: \`.github/workflows/measure.yml\` · run ${{ github.run_id }} · commit ${{ github.sha }}"
            echo
            echo "NOT_CONNECTED yazan satır ölçülemedi demektir, sıfır demek DEĞİLDİR."
            echo
            echo '## Bağlantı durumu'
            echo
            echo '```'
            cat smoke.txt 2>/dev/null || echo "(duman testi çıktısı yok)"
            echo '```'
            echo
            echo '## Ölçüm'
            echo
            echo '```'
            cat measure.txt
            echo '```'
            echo
            echo '## Kırılım — gelir siteleri'
            echo
            echo "En değerli bölüm **sıfır tıklı ağırlık**: çok gösterim alıp hiç tıklanmayan sorgular."
            echo
            echo '```'
            cat detail.txt 2>/dev/null || echo "(kırılım üretilemedi)"
            echo '```'
            echo
            echo '## Konu fırsatı — 7 site, haftada 2 konu'
            echo
            echo "KANIT: sitenin kendi GSC verisinde zaten görünüp tıklanmayan gerçek sorgu."
            echo "EDİTORYAL: registry business_category'sinden türetilmiş öneri (GSC'de yeterli"
            echo "hacim yoksa). İkisi de Google Trends veya rakip analizi DEĞİL. Bu bir yayın"
            echo "listesi değil, \"buraya bak\" listesi — insan onayı olmadan hiçbiri yazıya"
            echo "dönüşmez, dönüşse bile PR → CI → merge zincirinden geçer."
            echo
            echo '```'
            cat topics.txt 2>/dev/null || echo "(konu fırsatı üretilemedi)"
            echo '```'
          } > reports/measure-latest.md
          cp reports/measure-latest.md "reports/runs/$(date -u +%Y-%m-%d)-measure.md" 2>/dev/null \
            || { mkdir -p reports/runs; cp reports/measure-latest.md "reports/runs/$(date -u +%Y-%m-%d)-measure.md"; }

      # JSON'u kanonik yola koyar (ROLLING SNAPSHOT: dosya her hafta üzerine yazılır; tarihli kopya YOK —
      # 7 site x 500 sorgu haftalık MB'larca JSON; sürüm geçmişini git zaten tutar). YALNIZ bu workflow yazar
      # (tek yazıcı); commit'i aşağıdaki TEK kalıcılık betiği çağrısı yapar. JSON üretilemediyse mevcut latest'e
      # DOKUNULMAZ: eski dosya yaşlanır, skorkart tazelik eşiğinde (10 gün) UNKNOWN-STALE der; bayat veri taze
      # görünmez, boş/yarım dosya yazılmaz.
      - name: Ölçüm JSON'unu yerleştir
        if: always() && steps.measure.outcome == 'success'
        run: |
          if [ "${{ steps.measure.outputs.json_failed }}" != "true" ] && [ -s measure-json/measure-report.json ]; then
            mkdir -p reports
            cp measure-json/measure-report.json reports/measure-report-latest.json
            echo "- sgos.measure-report.v1 JSON: yazıldı (reports/measure-report-latest.json)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **UYARI: sgos.measure-report.v1 JSON üretilemedi.** Markdown raporu etkilenmedi; reports/measure-report-latest.json GÜNCELLENMEDİ, skorkart bu dosyayı tazelik eşiğinden sonra UNKNOWN-STALE okur. Koşu sonunda kırmızı olacak." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Özet
        if: always()
        run: cat reports/measure-latest.md >> "$GITHUB_STEP_SUMMARY" || echo "Rapor üretilemedi — adım loglarına bak." >> "$GITHUB_STEP_SUMMARY"

      # Raporu depoya yazmak, bir sonraki oturumun rakamlara ulaşmasının en basit
      # yolu: artifact indirmek gerekmez, dosya orada durur.
      - name: Raporu depoya yaz
        if: github.event_name == 'schedule' || inputs.commit_report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ortak güvenli kalıcılık sözleşmesi (docs/persistence-safety.md): izin listeli add, değişiklik
          # yoksa commit yok, fetch+rebase+sınırlı yeniden deneme, force yok, çatışmada kırmızı.
          bash scripts/persist-history.sh -m "ölçüm: $(date -u +%Y-%m-%d) (otomatik)" \
            reports/measure-latest.md reports/runs/ content/topic-ledger.json reports/measure-report-latest.json

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: measure-${{ github.run_id }}
          path: |
            reports/measure-latest.md
            reports/measure-report-latest.json
            measure-json/measure-report.json
            measure-json/measure-report.error.txt
            smoke.txt
            measure.txt
            detail.txt
            topics.txt
            content/topic-ledger.json
          retention-days: 30
          if-no-files-found: warn

      # SON adim: JSON anlık görüntüsü üretilemediyse kosu KIRMIZI biter — ama rapor, commit ve artifact (yukarıda)
      # zaten tamamlandi; hicbir sey kaybolmaz. Olcumun kendisi cokmusse (steps.measure basarisiz) bu adim calismaz:
      # o zaten kirmizi, iki kez bildirmeye gerek yok.
      - name: Ölçüm JSON kapısı
        if: always() && steps.measure.outcome == 'success'
        run: |
          if [ "${{ steps.measure.outputs.json_failed }}" = "true" ] || [ ! -s measure-json/measure-report.json ]; then
            echo "::error::sgos.measure-report.v1 JSON anlık görüntüsü üretilemedi (reports/measure-report-latest.json güncellenmedi). Markdown raporu ve ledger commit edildi."
            exit 1
          fi
          node -e 'const r=JSON.parse(require("fs").readFileSync("measure-json/measure-report.json","utf8")); if(r.schema!=="sgos.measure-report.v1"||!r.sites||!Object.keys(r.sites).length){console.error("JSON gecersiz");process.exit(1)}'
