# Depo testlerini her PR'da calistirir.
#
# 2026-09-21'e kadar bu depoda 65 test vardi ve HICBIRI PR'da kosmuyordu:
# iki workflow da yalnizca workflow_dispatch + schedule ile tetikleniyordu.
# Yani bir PR testleri kirabilir ve merge edilene kadar kimse gormezdi.
#
# Bu is ag ERISIMI GEREKTIRMEZ: testler kendi HTTP fixture sunucularini
# ayaga kaldiriyor. Dolayisiyla bloke edici olmasi guvenli — gecici bir
# dis kesinti bu isi kirmizi yakamaz.
#
# Test mantiginin TEK kopyasi tests-reusable.yml'dedir; bu dosya normal tetikler
# (pull_request/push/workflow_dispatch) icin github.sha ile ona delege eder.
# clarity-daily.yml de ayni reusable workflow'u, persist adiminin tam pushlanan
# SHA'si ile cagirir (Option B: persist-sonrasi dogrulama, bkz. docs/persistence-safety.md).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests-reusable.yml
    with:
      ref: ${{ github.sha }}
