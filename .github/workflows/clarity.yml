# Search Growth OS — native Microsoft Clarity olcumu (salt-okunur, GitHub Actions runner)
#
# NEDEN VAR: Clarity verisini kisisel bilgisayara, Chrome oturumuna ya da eski
# site-health-monitor rutinine BAGLI OLMADAN okumak. GSC ve GA4 gibi: kimlik GitHub Secret'ta,
# cikti calisma dizininde, sonuc artifact olarak.
#
# SADECE ELLE (workflow_dispatch): schedule YOK. Once gercek token'larla canli dogrulama yapilacak;
# kalici gecmis ve zamanlama bundan SONRA ayrica tasarlanir.
#
# BUTCE: Microsoft proje basina gunde 10 istege izin veriyor (resmi dokuman, proje sahibinden). Bu is bir
# kosuda site basina 3 istek yapar (device, acquisition, content; numOfDays=1). Ayni gun en fazla
# 3 kosu onerilir (9 istek). 429'da yeniden DENENMEZ. `clarity-smoke` API'ye GITMEZ.
#
# GIZLILIK: token YALNIZCA `secrets.*` -> env; komut satirina, loga, artifact'e, hata mesajina girmez.
# YAZMA YOK: Clarity export'u salt-okunur GET'tir. Hicbir production sitesine yazilmaz, depoya
# commit atilmaz (`contents: read`). Eski site-health-monitor'a DOKUNULMAZ.
#
# KIMLIK YOKSA: is yesil kalir, rapor NOT_CONNECTED yazar; hicbir API cagrisi yapilmaz.

name: Clarity (native, read-only)

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Tek site kimligi (bos = registry'deki tum siteler). Gunluk butceyi korumak icin tek site secebilirsin."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: clarity
  cancel-in-progress: false

jobs:
  clarity:
    name: clarity (3 istek / site / kosu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Registry gate
        run: node --experimental-strip-types src/cli.ts registry config/sites.yaml

      - name: Clarity smoke (offline, API cagrisi YOK)
        env:
          SEARCH_GROWTH_CLARITY_TOKENS_JSON: ${{ secrets.SEARCH_GROWTH_CLARITY_TOKENS_JSON }}
          SITE: ${{ inputs.site }}
        run: |
          set -o pipefail
          case "$SITE" in ''|*[!a-z0-9]*) [ -z "$SITE" ] || { echo "site kimligi kucuk harf/rakam olmali"; exit 1; };; esac
          node --experimental-strip-types src/cli.ts clarity-smoke config/sites.yaml ${SITE:+--site "$SITE"} | tee clarity-smoke.txt

      - name: Clarity olcum
        env:
          SEARCH_GROWTH_CLARITY_TOKENS_JSON: ${{ secrets.SEARCH_GROWTH_CLARITY_TOKENS_JSON }}
          SITE: ${{ inputs.site }}
        run: |
          set -o pipefail
          node --experimental-strip-types src/cli.ts clarity-measure config/sites.yaml --out clarity-out ${SITE:+--site "$SITE"} | tee clarity-measure.txt

      - name: Ozet
        if: always()
        run: |
          { cat clarity-out/clarity-summary.md 2>/dev/null || echo "Clarity raporu uretilemedi — adim loglarina bak."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: clarity-${{ github.run_id }}
          path: |
            clarity-out/
            clarity-smoke.txt
            clarity-measure.txt
          retention-days: 30
          if-no-files-found: warn
