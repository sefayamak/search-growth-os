# Search Growth OS — portfolio content check (read-only)
#
# Answers "which of my sites has gone quiet" for the whole registry in one pass, without
# depending on anyone's personal computer. It reads robots.txt, sitemaps and a small
# sample of content pages, and writes nothing to any website.
#
# Deliberately NOT here: any write to a site, any deployment, any credential, any SERP
# scraping. Cadence measurement needs no secrets, which is why this can run on a schedule.

name: Portfolio content check (read-only)

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Single registry site id, or blank for the whole portfolio"
        type: string
        default: ""
      onboarded_only:
        description: "Skip sites that are registered but not onboarded"
        type: boolean
        default: false
      sample:
        description: "Content pages opened per site to read their stated publish date"
        type: string
        default: "6"
      delay_ms:
        description: "Politeness delay between requests, milliseconds"
        type: string
        default: "800"
  schedule:
    # 06:10 UTC Mondays (09:10 Europe/Istanbul) — ahead of the weekly audit, so the
    # content question is answered before the technical one each week.
    - cron: "10 6 * * 1"

permissions:
  contents: read

concurrency:
  group: portfolio-check
  cancel-in-progress: false

jobs:
  cadence:
    name: measure publishing cadence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Registry gate
        run: node --experimental-strip-types src/cli.ts registry config/sites.yaml

      - name: Portfolio cadence
        env:
          SEARCH_GROWTH_USER_AGENT: "SearchGrowthOS/0.1 (+https://pamistanbul.com; read-only content cadence check; contact hello@pamistanbul.com)"
        run: |
          set -o pipefail
          node --experimental-strip-types src/cli.ts portfolio \
            ${{ inputs.site != '' && format('--site {0}', inputs.site) || '' }} \
            ${{ inputs.onboarded_only == true && '--onboarded-only' || '' }} \
            --sample "${{ inputs.sample || '6' }}" \
            --delay "${{ inputs.delay_ms || '800' }}" \
            --out reports/runs | tee portfolio-report.md
          # Exit 4 means at least one host could not be measured. Failing here keeps an
          # unreachable site from reading as "nothing to report" in a scheduled run.

      - name: Summary
        if: always()
        run: |
          if [ -f portfolio-report.md ]; then
            { echo "## Portfolio content check"; echo; cat portfolio-report.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: portfolio-check-${{ github.run_id }}
          path: |
            portfolio-report.md
            reports/runs/
          retention-days: 30
          if-no-files-found: warn
