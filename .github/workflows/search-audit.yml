# Search Growth OS — remote read-only search audit
#
# Why this exists: a development sandbox usually has no outbound access to the
# production domains, so a real crawl cannot run there. A GitHub-hosted runner
# has ordinary internet egress, which makes it the correct place to measure a
# public website without depending on anyone's personal computer.
#
# Deliberately NOT here, and not to be added without a separate decision: any
# write to a website, any deployment, any SEO remediation PR, any Google or Bing
# credential, any SERP scraping. It measures and reports. A public crawl needs
# no secrets at all.

name: Search audit (read-only)

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Registry site id (config/sites.yaml). Must be onboarded."
        type: string
        default: pamistanbul
      mode:
        description: "sample = link crawl up to max_pages · full = every eligible sitemap URL"
        type: choice
        options: [sample, full]
        default: sample
      max_pages:
        description: "Hard page cap (sample mode; also the ceiling in full mode)"
        type: string
        default: "120"
      delay_ms:
        description: "Politeness delay between requests, milliseconds"
        type: string
        default: "800"
  schedule:
    # 06:40 UTC Mondays (09:40 Europe/Istanbul). Off-peak, weekly, one site, sample mode.
    - cron: "40 6 * * 1"

# Read-only by construction: the token cannot write to this repository.
permissions:
  contents: read

concurrency:
  group: search-audit-${{ inputs.site || 'pamistanbul' }}
  cancel-in-progress: false

jobs:
  audit:
    name: crawl and audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Registry gate
        run: node --experimental-strip-types src/cli.ts registry config/sites.yaml

      - name: Crawl and audit
        env:
          # Honest identification. Never impersonates Googlebot or any other crawler,
          # and points at a page a site owner can read if they see it in their logs.
          SEARCH_GROWTH_USER_AGENT: "SearchGrowthOS/0.1 (+https://pamistanbul.com; read-only site audit; contact hello@pamistanbul.com)"
        run: |
          set -o pipefail
          node --experimental-strip-types src/cli.ts audit \
            --site "${{ inputs.site || 'pamistanbul' }}" \
            ${{ (inputs.mode == 'full') && '--full' || '' }} \
            --max-pages "${{ inputs.max_pages || '120' }}" \
            --delay "${{ inputs.delay_ms || '800' }}" \
            --out reports/runs | tee audit-report.md
          # The CLI exits 3 when the target is unreachable; `set -o pipefail` makes that
          # fail the job instead of publishing an empty report that reads as a clean site.

      # Compact, greppable tail. The full report is long, so the numbers that matter
      # are reprinted at the end of the log where they are easy to read.
      - name: Compact result
        if: always()
        run: |
          F=$(ls -t reports/runs/*.audit.json 2>/dev/null | head -1)
          [ -z "$F" ] && { echo "RESULT: no audit json produced"; exit 0; }
          node --experimental-strip-types bin/summarize.ts "$F"

      - name: Summary
        if: always()
        run: |
          if [ -f audit-report.md ]; then
            { echo "## Search audit — ${{ inputs.site || 'pamistanbul' }} (${{ inputs.mode || 'sample' }})"; echo; head -c 60000 audit-report.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — the crawl did not reach the target. See the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: search-audit-${{ inputs.site || 'pamistanbul' }}-${{ github.run_id }}
          path: |
            audit-report.md
            reports/runs/
          retention-days: 30
          if-no-files-found: warn
